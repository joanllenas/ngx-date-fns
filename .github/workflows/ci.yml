name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Every Monday, to test new Angular and date-fns releases.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Angular 17 supports Node.js 18 and 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build library
        run: npm run build
      - name: Run unit tests
        run: npm run test
      - name: Run e2e tests
        run: npm run e2e:ci

  smoke-test:
    name: Smoke test with the latest Angular and date-fns
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # The latest Angular CLI needs Node.js 22 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build library
        run: npm run build
      - name: Build a new app with the packed library
        run: npm run smoke-test
